# Per-home Qdrant instance for firstmate's local context index (bin/fm-context-index).
# It is deliberately separate from any other Qdrant on this machine AND from any
# other firstmate home's: the compose project, container name, named volume, and
# loopback port all come from that home's identity, so no two homes can share a
# store. Every value is required, so a missing one stops compose with the
# variable's own name instead of starting an unidentified container.
#
#   env $(bin/fm-context-index identity --env) docker compose -f docs/examples/fm-context-qdrant.compose.yml up -d
#   env $(bin/fm-context-index identity --env) docker compose -f docs/examples/fm-context-qdrant.compose.yml ps
#   env $(bin/fm-context-index identity --env) docker compose -f docs/examples/fm-context-qdrant.compose.yml down
#
# The substitution is unquoted on purpose: identity --env prints one assignment
# per line and publishes only values that cannot contain whitespace, so
# word-splitting them into arguments of env is what is wanted.
#
# See docs/context-index.md for the full operator notes.
name: ${FM_CONTEXT_COMPOSE_PROJECT:?run bin/fm-context-index identity --env first}
services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: ${FM_CONTEXT_CONTAINER:?run bin/fm-context-index identity --env first}
    restart: unless-stopped
    ports:
      # Bound to loopback only: this index never leaves the machine.
      - "127.0.0.1:${FM_CONTEXT_PORT:?run bin/fm-context-index identity --env first}:6333"
    volumes:
      - storage:/qdrant/storage

volumes:
  storage:
    name: ${FM_CONTEXT_VOLUME:?run bin/fm-context-index identity --env first}
